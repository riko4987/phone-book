<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>企業全體組織通訊錄</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        /* 您的原始 CSS 設定在此處 */
        :root { --yj: #e91e63; --yj-bg: #fff0f3; --lk: #2e7d32; --lk-bg: #f1f8f1; --fac: #fbc02d; --fac-bg: #fff9e6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        /* ... (這裡保留您原本所有的 .company-card, .dept-group 等 CSS 設定) ... */
    </style>
</head>
<body>

    <div class="container" id="app">
        </div>

    <script>
        // 【請在此貼上您的 Google 試算表 CSV 發布連結】
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSI52Sao1nYZJFPijvpRlUY-H6L0Hu5x1oWyfAZi0vIVmvLGZ7NIOfMoOWlAYQ-vcs7l56RrxjR2CU8/pub?gid=373464397&single=true&output=csv';

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                renderDirectory(results.data);
            }
        });

        function renderDirectory(data) {
            const container = document.getElementById('app');
            container.innerHTML = ''; // 清空原本內容

            // 將資料按 [公司] -> [部門] 分組
            const groups = {};
            data.forEach(row => {
                const comp = row['公司'];
                const dept = row['部門'];
                if (!groups[comp]) groups[comp] = {};
                if (!groups[comp][dept]) groups[comp][dept] = [];
                groups[comp][dept].push(row);
            });

            // 渲染每一個公司卡片
            for (const comp in groups) {
                const card = document.createElement('div');
                card.className = `company-card ${comp.includes('力科') ? 'lk-card' : 'yj-card'}`;
                card.innerHTML = `<div class="comp-header ${comp.includes('力科') ? 'bg-lk' : 'bg-yj'}">${comp}</div>`;
                
                // 渲染部門
                for (const dept in groups[comp]) {
                    const deptGroup = document.createElement('div');
                    deptGroup.className = 'dept-group';
                    deptGroup.innerHTML = `
                        <div class="dept-title" onclick="toggleDept(this)">${dept} <span>[+]</span></div>
                        <div class="staff-list"></div>
                    `;
                    
                    const list = deptGroup.querySelector('.staff-list');
                    groups[comp][dept].forEach(staff => {
                        const item = document.createElement('div');
                        item.className = 'staff-item';
                        // 若有圖片則顯示
                        const photoDiv = staff['圖片連結'] ? `<div class="photo-pop"><img src="${staff['圖片連結']}"></div>` : '';
                        item.innerHTML = `<span>${staff['姓名']}</span><span class="ext-num">${staff['分機']}</span>${photoDiv}`;
                        list.appendChild(item);
                    });
                    card.appendChild(deptGroup);
                }
                container.appendChild(card);
            }
        }

        // 您原本的摺疊功能
        function toggleDept(el) {
            const group = el.parentElement;
            group.classList.toggle('expanded');
            el.querySelector('span').innerText = group.classList.contains('expanded') ? '[-]' : '[+]';
        }
    </script>
</body>
</html>
