<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>企業全體組織通訊錄 - 完整資料視覺化版</title>
    <style>
        :root { 
            --yj: #e91e63; --yj-bg: #fff0f3; 
            --lk: #2e7d32; --lk-bg: #f1f8f1; 
            --fac: #fbc02d; --fac-bg: #fff9e6; 
        }
        
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .main-title { text-align: center; color: #333; font-weight: bold; margin-bottom: 5px; }
        .update-info { text-align: center; color: #888; font-size: 0.85em; margin-bottom: 25px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start; }
        
        .company-card { background: white; border-radius: 12px; width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #ddd; margin-bottom: 20px; overflow: visible; }
        .comp-header { padding: 15px; color: white; text-align: center; font-weight: bold; font-size: 1.25em; border-radius: 12px 12px 0 0; }
        
        .bg-yj { background-color: var(--yj); }
        .bg-lk { background-color: var(--lk); }
        .bg-fac { background-color: var(--fac); color: #333; }

        .dept-group { border-bottom: 1px solid #eee; transition: background-color 0.3s ease; }
        
        .company-card.yj-card .dept-group:hover { background-color: var(--yj-bg); }
        .company-card.lk-card .dept-group:hover { background-color: var(--lk-bg); }
        .company-card.fac-card .dept-group:hover { background-color: var(--fac-bg); }

        .dept-title { padding: 12px 15px; font-weight: bold; display: flex; justify-content: space-between; cursor: pointer; border-left: 4px solid transparent; }
        .company-card.yj-card .dept-title { border-left-color: var(--yj); }
        .company-card.lk-card .dept-title { border-left-color: var(--lk); }
        .company-card.fac-card .dept-title { border-left-color: var(--fac); }

        .staff-list { display: none; padding: 0; }
        .expanded .staff-list { display: block; }

        .staff-item { display: flex; justify-content: space-between; padding: 10px 25px; border-bottom: 1px dotted #eee; position: relative; cursor: pointer; min-height: 24px;}
        .staff-item:hover { background-color: rgba(0,0,0,0.05); color: #d32f2f; font-weight: bold; }
        .ext-num { font-family: "Consolas", monospace; color: #555; }

        .photo-pop {
            display: none; position: absolute; left: 105%; top: 50%; transform: translateY(-50%);
            width: 320px; background: white; border: 2px solid #ccc; box-shadow: 10px 10px 30px rgba(0,0,0,0.3); 
            z-index: 9999; padding: 12px; border-radius: 12px; pointer-events: none;
        }

        .fac-card .photo-pop {
            left: auto; right: 105%; box-shadow: -10px 10px 30px rgba(0,0,0,0.3);
        }

        .yj-card .photo-pop { border-color: var(--yj); }
        .lk-card .photo-pop { border-color: var(--lk); }
        .fac-card .photo-pop { border-color: var(--fac); }
        .photo-pop img { width: 300px; height: 300px; object-fit: cover; border-radius: 8px; }
        .staff-item:hover .photo-pop { display: block; }
    </style>
</head>
<body>

<h1 class="main-title">企業全體組織通訊錄</h1>
<div id="update-date" class="update-info">更新日期：同步連線中...</div>

<div class="container">
    <div id="company-88" class="company-card yj-card">
        <div class="comp-header bg-yj">永鉅電機 (簡碼 88)</div>
        <div class="dept-container"></div>
    </div>

    <div id="company-66" class="company-card lk-card">
        <div class="comp-header bg-lk">力科光電 (簡碼 66)</div>
        <div class="dept-container"></div>
    </div>

    <div id="company-33" class="company-card fac-card">
        <div class="comp-header bg-fac">力科工廠 (簡碼 33)</div>
        <div class="dept-container"></div>
    </div>
</div>

<script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSI52Sao1nYZJFPijvpRlUY-H6L0Hu5x1oWyfAZi0vIVmvLGZ7NIOfMoOWlAYQ-vcs7l56RrxjR2CU8/pub?gid=373464397&single=true&output=csv";

    function getPhotoSuffix(deptName) {
        if (deptName.includes("倉庫")) return "_倉庫";
        if (deptName.includes("櫃台")) return "_櫃台";
        if (deptName.includes("中區")) return "_中區業務";
        if (deptName.includes("南區")) return "_南區業務";
        if (deptName.includes("國貿")) return "_國貿部";
        if (deptName.includes("Power技術")) return "_Power技術";
        if (deptName.includes("Power業務")) return "_Power業務";
        if (deptName.includes("RiKO業務")) return "_RiKO業務";
        if (deptName.includes("RiKO技術")) return "_RiKO技術";
        if (deptName.includes("業助")) return "_業助";
        if (deptName.includes("財會") || deptName.includes("人事")) return "_財會人事";
        if (deptName.includes("總經理")) return "_總經理室";
        if (deptName.includes("管理部")) return "_管理部";
        if (deptName.includes("總務")) return "_總務";
        if (deptName.includes("文管")) return "_文管";
        if (deptName.includes("資管")) return "_資管";
        if (deptName.includes("威力科")) return "_威力科";
        if (deptName.includes("美編")) return "_美編";
        if (deptName.includes("門市")) return "_門市";
        if (deptName.includes("機構")) return "_機構課";
        if (deptName.includes("技轉")) return "_技轉課";
        if (deptName.includes("實驗室")) return "_實驗室";
        if (deptName.includes("視覺")) return "_視覺小組";
        if (deptName.includes("光電")) return "_光電小組";
        if (deptName.includes("DALI")) return "_DALI小組";
        if (deptName.includes("PM")) return "_PM";
        if (deptName.includes("包射")) return "_包射區";
        if (deptName.includes("力科倉")) return "_力科倉";
        if (deptName.includes("光纖")) return "_光纖產線";
        if (deptName.includes("自動化") || deptName.includes("電子產線")) {
            if (deptName.includes("電子")) return "_電子產線";
            return "_自動化產線";
        }
        if (deptName.includes("電子自動化課")) return "_電子自動化課";
        if (deptName.includes("管理資材")) return "_管理資材課";
        if (deptName.includes("品保課")) return "_品保課";
        if (deptName.includes("會議室") || deptName.includes("實驗室")) return "_會議室實驗室";
        return "";
    }

    async function fetchExtensionData() {
        try {
            const response = await fetch(csvUrl);
            const csvText = await response.text();
            parseAndRender(csvText);
        } catch (error) {
            console.error("無法讀取雲端資料:", error);
        }
    }

    function parseAndRender(csvText) {
        // 使用正則拆分行，完全過濾掉隨機出現的空行與 \r 換行符號
        const rows = csvText.split(/\r?\n/).map(row => row.split(",").map(cell => cell.trim()));
        
        // 解析並同步更新日期
        if (rows[0] && rows[0].length > 0) {
            const lastCell = rows[0][rows[0].length - 1];
            if (lastCell && lastCell.match(/\d{4}/)) {
                document.getElementById("update-date").innerText = "更新日期：" + lastCell;
            }
        }

        // 初始化靜態三大公司結構對應容器
        const dataMap = {
            "88": {
                "會議室 (A8/A9)": [], "國貿部 (A7)": [], "RiKO業務 / 技術 / 業助 (A7)": [],
                "倉庫 / 櫃台 (A1)": [], "Power技術 / 業務 (A7)": [], "財會 / 人事 (A8)": [], "中區 / 南區業務": []
            },
            "66": {
                "總經理室 (A1)": [], "機構課 / 技轉課 / 實驗室 (A10)": [], "視覺 / 光電 / PM / DALI (A11)": [],
                "管理 / 總務 / 威力科 / 資管": [], "美編 / 門市 (A8/77)": []
            },
            "33": {
                "1F 包射、品保": [], "2F 力科倉": [], "3F 光纖產線": [],
                "4F 自動化產線 / 電子產線": [], "5F 電子自動化課": [], "6F 管理、資材課 / 品保課": [], "7F 會議室、實驗室": []
            }
        };

        // 預設各垂直線上的部門指標
        let currentDept88_left = "會議室 (A8/A9)";
        let currentDept88_mid = "國貿部 (A7)";
        let currentDept88_right = "RiKO業務 / 技術 / 業助 (A7)";
        
        let currentDept66_left = "總經理室 (A1)";
        let currentDept66_mid = "機構課 / 技轉課 / 實驗室 (A10)";
        let currentDept66_right = "視覺 / 光電 / PM / DALI (A11)";
        
        let currentDept33 = "1F 包射、品保";

        // 從第 9 行 (Index 8) 開始逐行往下掃描，採取「動態攔截標題，其餘精準歸類」策略
        for (let i = 8; i < rows.length; i++) {
            const r = rows[i];
            if (!r || r.length === 0) continue;

            // 1. 【永鉅 88】 子部門標題切換攔截
            if (r[0] && r[0].includes("倉庫")) { currentDept88_left = "倉庫 / 櫃台 (A1)"; continue; }
            if (r[0] && r[0].includes("中區")) { currentDept88_left = "中區 / 南區業務"; continue; }
            if (r[3] && r[3].includes("Power技術")) { currentDept88_mid = "Power技術 / 業務 (A7)"; continue; }
            if (r[6] && r[6].includes("財會")) { currentDept88_right = "財會 / 人事 (A8)"; continue; }

            // 2. 【力科 66】 子部門標題切換攔截
            if (r[9] && r[9].includes("管理")) { currentDept66_left = "管理 / 總務 / 威力科 / 資管"; continue; }
            if (r[9] && r[9].includes("美編")) { currentDept66_left = "美編 / 門市 (A8/77)"; continue; }

            // 3. 【力科工廠 33】 子部門標題切換攔截
            if (r[18]) {
                if (r[18].includes("2F")) { currentDept33 = "2F 力科倉"; continue; }
                if (r[18].includes("3F")) { currentDept33 = "3F 光纖產線"; continue; }
                if (r[18].includes("4F")) { currentDept33 = "4F 自動化產線 / 電子產線"; continue; }
                if (r[18].includes("5F")) { currentDept33 = "5F 電子自動化課"; continue; }
                if (r[18].includes("6F")) { currentDept33 = "6F 管理、資材課 / 品保課"; continue; }
                if (r[18].includes("7F")) { currentDept33 = "7F 會議室、實驗室"; continue; }
            }

            // 排除其餘大頂層過濾行（防範誤把表格的大欄位名稱塞成姓名）
            if (r[0] === "會議室" || r[3] === "國貿部 A7" || r[6] === "RiKO業務 A7" || r[9] === "總經理室 A1" || r[12] === "機構課 A10" || r[14] === "視覺小組 A11" || r[18] === "1F") continue;

            // 執行數據精確注入
            if (r[0] || r[1]) pushStaff(dataMap["88"], currentDept88_left, r[0], r[1]);
            if (r[3] || r[4]) pushStaff(dataMap["88"], currentDept88_mid, r[3], r[4]);
            if (r[6] || r[7]) pushStaff(dataMap["88"], currentDept88_right, r[6], r[7]);
            
            if (r[9] || r[10]) pushStaff(dataMap["66"], currentDept66_left, r[9], r[10]);
            if (r[12] || r[13]) pushStaff(dataMap["66"], currentDept66_mid, r[12], r[13]);
            if (r[14] || r[15]) pushStaff(dataMap["66"], currentDept66_right, r[14], r[15]);
            
            if (r[18] || r[19]) pushStaff(dataMap["33"], currentDept33, r[18], r[19]);
        }

        // 渲染至 HTML DOM 節點
        renderCompany("88", dataMap["88"]);
        renderCompany("66", dataMap["66"]);
        renderCompany("33", dataMap["33"]);
    }

    function pushStaff(compMap, deptName, name, ext) {
        if (!name && !ext) return;
        // 嚴格防止空值與殘留的格式線被劃入名單
        if (name === "" && ext === "") return;
        if (compMap[deptName]) {
            compMap[deptName].push({ name: name || "", ext: ext || "" });
        }
    }

    function renderCompany(compId, deptData) {
        const card = document.getElementById("company-" + compId);
        const container = card.querySelector(".dept-container");
        container.innerHTML = "";

        for (const [deptName, staffList] of Object.entries(deptData)) {
            if (staffList.length === 0) continue;

            const deptGroup = document.createElement("div");
            deptGroup.className = "dept-group";

            const deptTitle = document.createElement("div");
            deptTitle.className = "dept-title";
            deptTitle.innerHTML = `${deptName} <span>[+]</span>`;
            deptTitle.onclick = () => toggleDept(deptTitle);

            const staffListDiv = document.createElement("div");
            staffListDiv.className = "staff-list";

            staffList.forEach(staff => {
                const staffItem = document.createElement("div");
                staffItem.className = "staff-item";
                
                let photoHtml = "";
                if (staff.name) {
                    const suffix = getPhotoSuffix(deptName);
                    photoHtml = `<div class="photo-pop"><img src="images/${staff.name}${suffix}.png" onerror="this.parentElement.style.display='none';"></div>`;
                }

                staffItem.innerHTML = `<span>${staff.name}</span><span class="ext-num">${staff.ext}</span>${photoHtml}`;
                staffListDiv.appendChild(staffItem);
            });

            deptGroup.appendChild(deptTitle);
            deptGroup.appendChild(staffListDiv);
            container.appendChild(deptGroup);
        }
    }

    function toggleDept(el) {
        const group = el.parentElement;
        group.classList.toggle('expanded');
        el.querySelector('span').innerText = group.classList.contains('expanded') ? '[-]' : '[+]';
    }

    window.onload = fetchExtensionData;
</script>

</body>
</html>
