<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>公司通訊錄</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .row { border-bottom: 1px solid #ddd; padding: 10px 0; display: flex; justify-content: space-between; }
        .dept { font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <div id="app">資料載入中...</div>

    <script>
        // 【關鍵】請把您剛剛取得的 CSV 發布連結貼在這裡
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSI52Sao1nYZJFPijvpRlUY-H6L0Hu5x1oWyfAZi0vIVmvLGZ7NIOfMoOWlAYQ-vcs7l56RrxjR2CU8/pub?gid=373464397&single=true&output=csv';

        Papa.parse(CSV_URL, {
            download: true,
            header: false, // 強制不讀取標題，直接讀取原始資料
            skipEmptyLines: true,
            complete: function(results) {
                const app = document.getElementById('app');
                app.innerHTML = ''; // 清空載入中字樣

                // 每一行資料 row[0]是分機, row[1]是部門, row[2]是姓名
                results.data.forEach(row => {
                    const div = document.createElement('div');
                    div.className = 'row';
                    div.innerHTML = `
                        <span>${row[2] || ''}</span>
                        <span class="dept">${row[1] || ''}</span>
                        <span>${row[0] || ''}</span>
                    `;
                    app.appendChild(div);
                });
            }
        });
    </script>
</body>
</html>
