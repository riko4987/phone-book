<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>通訊錄</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .row { border-bottom: 1px solid #ccc; padding: 10px; display: flex; justify-content: space-between; }
        .data { font-weight: bold; }
    </style>
</head>
<body>
    <div id="app">正在讀取...</div>

    <script>
        // 【請貼上您的 CSV 網址】
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSI52Sao1nYZJFPijvpRlUY-H6L0Hu5x1oWyfAZi0vIVmvLGZ7NIOfMoOWlAYQ-vcs7l56RrxjR2CU8/pub?gid=373464397&single=true&output=csv';

        Papa.parse(CSV_URL, {
            download: true,
            header: false, // 改為 false，代表不讀取標題，直接讀取資料列
            skipEmptyLines: true,
            complete: function(results) {
                const app = document.getElementById('app');
                app.innerHTML = '';
                
                // results.data 變成一個二維陣列
                results.data.forEach((row, index) => {
                    // 如果第一行是標題，您可以把 index === 0 這行判斷去掉
                    // 目前設定直接從第一行開始顯示
                    const col1 = row[0] || ''; // 第 1 欄
                    const col2 = row[1] || ''; // 第 2 欄
                    const col3 = row[2] || ''; // 第 3 欄
                    
                    app.innerHTML += `<div class="row">
                        <span>${col1}</span> 
                        <span>${col2}</span> 
                        <span class="data">${col3}</span>
                    </div>`;
                });
            },
            error: function(err) {
                document.getElementById('app').innerText = '讀取失敗: ' + err.message;
            }
        });
    </script>
</body>
</html>
