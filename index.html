<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>通訊錄</title>
</head>
<body>
    <h1 id="msg">請稍候，系統正在檢查...</h1>

    <script>
        // 【這行一定要改！】請把下面這行引號內的文字，換成您從 Google 試算表拿到的 CSV 網址
        const url = '請貼上您的CSV發布網址';

        // 檢查有沒有填網址
        if (url === '請貼上您的CSV發布網址') {
            document.getElementById('msg').innerText = '錯誤：您還沒有填入 CSV 網址！';
        } else {
            fetch(url)
                .then(res => res.text())
                .then(data => {
                    document.getElementById('msg').innerText = '連線成功！已經抓到資料，共 ' + data.length + ' 個字元。';
                    console.log(data); // 按 F12 可以看到資料內容
                })
                .catch(err => {
                    document.getElementById('msg').innerText = '連線失敗，請檢查網路或網址。錯誤: ' + err;
                });
        }
    </script>
</body>
</html>
