<!DOCTYPE html>
<html>
<body>
    <div id="status">正在測試連線...</div>
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbylj-bQt9r-SmF-l7fND7boAe-vVEr5f3RHZOIr0UldkvfcDRJDm03fCTA3rbOx7k2Kww/exec';

        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').innerText = '連線成功！資料已抓取，共 ' + data.length + ' 筆。';
                console.log(data); // 按 F12 可以看到資料
            })
            .catch(err => {
                document.getElementById('status').innerText = '連線失敗，請檢查網址與部署權限。錯誤：' + err;
            });
    </script>
</body>
</html>
