<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>公司通訊錄</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div id="result">資料載入中...</div>

    <script>
        // 【請把下面網址換成您剛剛複製的 CSV 發布網址】
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSI52Sao1nYZJFPijvpRlUY-H6L0Hu5x1oWyfAZi0vIVmvLGZ7NIOfMoOWlAYQ-vcs7l56RrxjR2CU8/pub?gid=373464397&single=true&output=csv';

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                // 這裡簡單顯示結果
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(results.data, null, 2) + '</pre>';
            },
            error: function(err) {
                document.getElementById('result').innerText = '讀取失敗: ' + err;
            }
        });
    </script>
</body>
</html>
