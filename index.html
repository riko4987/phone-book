<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>企業組織通訊錄</title>
</head>
<body>
    <div id="container">讀取中...</div>

    <script>
        // 【關鍵】請把這裡替換成您剛剛複製的 /exec 網址
        const API_URL = 'https://script.google.com/macros/s/AKfycbyCxu9ywYVKBB7F_19ZIQ8QeWHYJvn8ElYEMSDOnfD3VTRYbDTT2ruzI4VvGqAkULvxSQ/exec';

        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                // data[0] 是標題行，data[1] 之後才是資料
                // data[i][0]=公司, [1]=部門, [2]=姓名, [3]=分機
                document.getElementById('container').innerHTML = '讀取成功！總筆數：' + (data.length - 1);
                console.log(data); // 按 F12 查看資料是否已經載入
            })
            .catch(err => {
                document.getElementById('container').innerHTML = '連線錯誤：' + err;
            });
    </script>
</body>
</html>
