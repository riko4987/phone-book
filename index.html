<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>企業全體組織通訊錄</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --main-bg: #f0f2f5; --card-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--main-bg); margin: 0; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .company-card { background: white; border-radius: 12px; width: 450px; box-shadow: var(--card-shadow); border: 1px solid #ddd; }
        .comp-header { padding: 15px; color: white; text-align: center; font-weight: bold; font-size: 1.25em; border-radius: 12px 12px 0 0; background-color: #333; }
        .dept-group { border-bottom: 1px solid #eee; }
        .dept-title { padding: 12px 15px; font-weight: bold; display: flex; justify-content: space-between; cursor: pointer; border-left: 4px solid #333; }
        .staff-list { display: none; padding: 0; }
        .expanded .staff-list { display: block; }
        .staff-item { display: flex; justify-content: space-between; padding: 10px 25px; border-bottom: 1px dotted #eee; cursor: pointer; }
        .ext-num { font-family: "Consolas", monospace; color: #555; font-weight: bold; }
    </style>
</head>
<body>

    <h1 style="text-align: center;">企業全體組織通訊錄</h1>
    <div class="container" id="app">正在讀取資料，請稍候...</div>

    <script>
        // ⚠️ 步驟：請將您發布的 CSV 網址貼在下方
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSI52Sao1nYZJFPijvpRlUY-H6L0Hu5x1oWyfAZi0vIVmvLGZ7NIOfMoOWlAYQ-vcs7l56RrxjR2CU8/pub?gid=373464397&single=true&output=csv';

        Papa.parse(CSV_URL, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                const app = document.getElementById('app');
                app.innerHTML = ''; // 清空載入提示
                const data = results.data;
                const tree = {};

                // 自動將數百筆資料分類
                data.forEach(row => {
                    const c = row['公司'] || '未分類';
                    const d = row['部門'] || '其他';
                    if (!tree[c]) tree[c] = {};
                    if (!tree[c][d]) tree[c][d] = [];
                    tree[c][d].push(row);
                });

                // 生成 HTML
                for (const comp in tree) {
                    const card = document.createElement('div');
                    card.className = 'company-card';
                    card.innerHTML = `<div class="comp-header">${comp}</div>`;
                    
                    for (const dept in tree[comp]) {
                        const group = document.createElement('div');
                        group.className = 'dept-group';
                        group.innerHTML = `<div class="dept-title" onclick="this.parentElement.classList.toggle('expanded')">${dept} <span>[+]</span></div>
                                           <div class="staff-list"></div>`;
                        
                        const list = group.querySelector('.staff-list');
                        tree[comp][dept].forEach(p => {
                            const item = document.createElement('div');
                            item.className = 'staff-item';
                            item.innerHTML = `<span>${p['姓名']}</span><span class="ext-num">${p['分機'] || ''}</span>`;
                            list.appendChild(item);
                        });
                        card.appendChild(group);
                    }
                    app.appendChild(card);
                }
            }
        });
    </script>
</body>
</html>
