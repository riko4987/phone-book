<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>企業全體組織通訊錄 - 試算表即時連動版</title>
    <style>
        :root { 
            --yj: #e91e63; --yj-bg: #fff0f3; 
            --lk: #2e7d32; --lk-bg: #f1f8f1; 
            --fac: #fbc02d; --fac-bg: #fff9e6; 
        }
        
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .main-title { text-align: center; color: #333; font-weight: bold; margin-bottom: 5px; }
        .update-info { text-align: center; color: #888; font-size: 0.85em; margin-bottom: 25px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start; }
        
        .company-card { background: white; border-radius: 12px; width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #ddd; margin-bottom: 20px; overflow: visible; }
        .comp-header { padding: 15px; color: white; text-align: center; font-weight: bold; font-size: 1.25em; border-radius: 12px 12px 0 0; }
        
        .bg-yj { background-color: var(--yj); }
        .bg-lk { background-color: var(--lk); }
        .bg-fac { background-color: var(--fac); color: #333; }

        .dept-group { border-bottom: 1px solid #eee; transition: background-color 0.3s ease; }
        
        .company-card.yj-card .dept-group:hover { background-color: var(--yj-bg); }
        .company-card.lk-card .dept-group:hover { background-color: var(--lk-bg); }
        .company-card.fac-card .dept-group:hover { background-color: var(--fac-bg); }

        .dept-title { padding: 12px 15px; font-weight: bold; display: flex; justify-content: space-between; cursor: pointer; border-left: 4px solid transparent; user-select: none; }
        .company-card.yj-card .dept-title { border-left-color: var(--yj); }
        .company-card.lk-card .dept-title { border-left-color: var(--lk); }
        .company-card.fac-card .dept-title { border-left-color: var(--fac); }

        .staff-list { display: none; padding: 0; background-color: #fafafa; }
        .expanded .staff-list { display: block; }

        .staff-item { display: flex; justify-content: space-between; padding: 10px 25px; border-bottom: 1px dotted #eee; position: relative; cursor: pointer; min-height: 24px;}
        .staff-item:hover { background-color: rgba(0,0,0,0.05); color: #d32f2f; font-weight: bold; }
        .ext-num { font-family: "Consolas", monospace; color: #555; }

        /* 懸浮大頭照特效 */
        .photo-pop {
            display: none; position: absolute; left: 105%; top: 50%; transform: translateY(-50%);
            width: 320px; background: white; border: 2px solid #ccc; box-shadow: 10px 10px 30px rgba(0,0,0,0.3); 
            z-index: 9999; padding: 12px; border-radius: 12px; pointer-events: none;
        }
        .fac-card .photo-pop { left: auto; right: 105%; box-shadow: -10px 10px 30px rgba(0,0,0,0.3); }
        .yj-card .photo-pop { border-color: var(--yj); }
        .lk-card .photo-pop { border-color: var(--lk); }
        .fac-card .photo-pop { border-color: var(--fac); }
        .photo-pop img { width: 300px; height: 300px; object-fit: cover; border-radius: 8px; }
        .staff-item:hover .photo-pop { display: block; }

        .loading { text-align: center; padding: 30px; color: #666; font-size: 1.1em; width: 100%; }
    </style>
</head>
<body>

<h1 class="main-title">企業全體組織通訊錄</h1>
<div class="update-info" id="sync-time">正在連動雲端試算表...</div>

<div class="container" id="address-book-container">
    <div class="loading">正在即時同步雲端試算表資料，請稍候...</div>
</div>

<script>
    // 1. 請在此處替換為您的 Google 試算表「發布為 CSV」的網路連結
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSI52Sao1nYZJFPijvpRlUY-H6L0Hu5x1oWyfAZi0vIVmvLGZ7NIOfMoOWlAYQ-vcs7l56RrxjR2CU8/pub?gid=373464397&single=true&output=csv';

    // 2. 嚴格鎖定三大核心分類
    const targetCompanies = [
        { key: '永鉅電機', name: '永鉅電機 (簡碼 88)', cardClass: 'yj-card', headerClass: 'bg-yj' },
        { key: '力科光電', name: '力科光電 (簡碼 66)', cardClass: 'lk-card', headerClass: 'bg-lk' },
        { key: '力科工廠', name: '力科工廠 (簡碼 33)', cardClass: 'fac-card', headerClass: 'bg-fac' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
        if (csvUrl === 'YOUR_GOOGLE_SHEET_CSV_URL' || !csvUrl) {
            document.getElementById('address-book-container').innerHTML = '<div class="loading" style="color:red;">請在程式碼中填入您的 Google 試算表 CSV 發布網址。</div>';
            return;
        }

        fetch(csvUrl)
            .then(response => response.text())
            .then(csvData => {
                const parsedData = parseCSVForce(csvData);
                if (parsedData.length === 0) {
                    document.getElementById('address-book-container').innerHTML = '<div class="loading" style="color:red;">解析失敗，請確認試算表內是否有資料。</div>';
                    return;
                }
                renderAddressBook(parsedData);
                
                const now = new Date();
                document.getElementById('sync-time').innerText = `雲端即時同步成功！最新同步：${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('address-book-container').innerHTML = '<div class="loading" style="color:red;">連線失敗！請檢查試算表的發布設定。</div>';
            });
    });

    // 3. 徹底拋棄傳統 CSV 的引號判斷，改用最乾淨、絕對不會卡死崩潰的暴力防呆拆解法
    function parseCSVForce(text) {
        const lines = text.split(/\r\n|\n/);
        const result = [];
        if (lines.length === 0 || !lines[0].trim()) return result;

        // 讀取第一列作為標題列，移除所有引號與怪字元
        const rawHeaders = lines[0].split(',').map(h => h.replace(/"/g, '').trim().replace(/^\uFEFF/, ''));
        const headerMapping = { company: 0, dept: 1, name: 2, ext: 3, memo: 4 };

        // 模糊尋找欄位索引
        rawHeaders.forEach((h, index) => {
            if (h.includes('公司')) headerMapping.company = index;
            else if (h.includes('部門')) headerMapping.dept = index;
            else if (h.includes('姓名')) headerMapping.name = index;
            else if (h.includes('分機')) headerMapping.ext = index;
            else if (h.includes('備註')) headerMapping.memo = index;
        });

        // 逐行暴力拆解，把多餘的引號全部強制清空，確保絕對不斷線、不卡死
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            
            const cols = lines[i].split(',').map(c => c.replace(/"/g, '').trim());
            
            const compVal = cols[headerMapping.company] || '';
            const deptVal = cols[headerMapping.dept] || '';
            const nameVal = cols[headerMapping.name] || '';
            const extVal = cols[headerMapping.ext] || '';
            const memoVal = cols[headerMapping.memo] || '';

            if (!compVal && !deptVal && !nameVal) continue; // 濾掉底部的空白列

            result.push({
                company: compVal,
                dept: deptVal,
                name: nameVal,
                ext: extVal,
                memo: memoVal
            });
        }
        return result;
    }

    // 4. 動態安全建構畫面 (保留您要的所有排版與效果)
    function renderAddressBook(data) {
        const container = document.getElementById('address-book-container');
        container.innerHTML = ''; 

        targetCompanies.forEach(comp => {
            // 模糊搜尋大公司名稱
            const compRows = data.filter(row => row.company === comp.key || row.company.includes(comp.key));
            if (compRows.length === 0) return;

            // 依照試算表的順序進行部門群組
            const deptMap = new Map();
            compRows.forEach(row => {
                const deptName = row.dept || '其他';
                if (!deptMap.has(deptName)) {
                    deptMap.set(deptName, []);
                }
                deptMap.get(deptName).push(row);
            });

            const card = document.createElement('div');
            card.className = `company-card ${comp.cardClass}`;

            const header = document.createElement('div');
            header.className = `comp-header ${comp.headerClass}`;
            header.innerText = comp.name;
            card.appendChild(header);

            const deptContainer = document.createElement('div');
            deptContainer.className = 'dept-container';

            deptMap.forEach((staffs, deptTitle) => {
                const deptGroup = document.createElement('div');
                deptGroup.className = 'dept-group';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'dept-title';
                titleDiv.setAttribute('onclick', 'toggleDept(this)');
                titleDiv.innerHTML = `${deptTitle} <span>[+]</span>`;

                const staffList = document.createElement('div');
                staffList.className = 'staff-list';

                staffs.forEach(staff => {
                    const name = staff.name;
                    const ext = staff.ext;
                    const memo = staff.memo;
                    
                    if (!name && !ext) return;

                    const item = document.createElement('div');
                    item.className = 'staff-item';
                    const displayName = memo ? `${name} (${memo})` : name;
                    
                    // 大頭照對應完整部門名稱 (只過濾掉斜線)
                    const safeDeptTitle = deptTitle.replace(/[\/]/g, '').trim();
                    const imgUrl = `images/${name}_${safeDeptTitle}.png`;

                    item.innerHTML = `
                        <span>${displayName}</span>
                        <span class="ext-num">${ext}</span>
                        <div class="photo-pop">
                            <img src="${imgUrl}" onerror="this.parentElement.style.display='none';">
                        </div>
                    `;
                    staffList.appendChild(item);
                });

                deptGroup.appendChild(titleDiv);
                deptGroup.appendChild(staffList);
                deptContainer.appendChild(deptGroup);
            });

            card.appendChild(deptContainer);
            container.appendChild(card);
        });
    }

    // 保證一用就開的展開函式
    function toggleDept(el) {
        const group = el.parentElement;
        group.classList.toggle('expanded');
        
        const icon = el.querySelector('span');
        if (group.classList.contains('expanded')) {
            icon.innerText = '[-]';
        } else {
            icon.innerText = '[+]';
        }
    }
</script>

</body>
</html>
