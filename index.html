<!DOCTYPE html>
<html>
<body>
    <div id="debug">正在讀取...</div>
    <script>
        // 這裡填入您確認過的 GAS 網址
        const API_URL = 'https://script.google.com/macros/s/AKfycbwfmL7IA3nZ_jU-wjtSc1XbYIuaqmjEadhwMDSOZf--a_3gYbo9tbhFODp4Bm-w9etcoA/exec';

        fetch(API_URL)
            .then(res => res.text()) // 先抓純文字，不要轉 JSON
            .then(text => {
                // 直接把抓到的內容丟到螢幕上，這樣您就知道到底是發生什麼事了
                document.getElementById('debug').innerText = '抓到的內容是：' + text;
                console.log(text);
            })
            .catch(err => {
                document.getElementById('debug').innerText = '錯誤：' + err;
            });
    </script>
</body>
</html>
