<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>公司通訊錄</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { border: 1px solid #ddd; margin-bottom: 20px; padding: 10px; border-radius: 5px; }
        .dept-title { font-weight: bold; background: #333; color: white; padding: 5px; }
        .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<input type="text" id="search" placeholder="搜尋..." style="width: 100%; padding: 10px;">
<div id="app">資料載入中...</div>

<script>
    const CSV_URL = '請貼上您的CSV發布連結';

    Papa.parse(CSV_URL, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
            const data = results.data;
            const app = document.getElementById('app');

            function render(query = '') {
                app.innerHTML = '';
                const groups = {};
                
                data.forEach(row => {
                    const ext = row[0] || '';
                    const dept = row[1] || '未分類';
                    const name = row[2] || '';
                    
                    if (query && !(ext.includes(query) || dept.includes(query) || name.includes(query))) return;
                    
                    if (!groups[dept]) groups[dept] = [];
                    groups[dept].push({ ext, name });
                });

                for (const dept in groups) {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `<div class="dept-title">${dept}</div>` + 
                        groups[dept].map(item => `<div class="row"><span>${item.name}</span><span>${item.ext}</span></div>`).join('');
                    app.appendChild(div);
                }
            }

            render();
            document.getElementById('search').addEventListener('input', (e) => render(e.target.value));
        }
    });
</script>
</body>
</html>
