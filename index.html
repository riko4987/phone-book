<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>除錯模式</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .debug-box { background: #f0f0f0; padding: 15px; border: 2px solid #333; }
    </style>
</head>
<body>
    <div class="debug-box">
        <h3>系統已抓到資料！請對照下方的欄位名稱：</h3>
        <p id="fields"></p>
        <hr>
        <h3>這是第一筆資料的原始內容：</h3>
        <p id="raw-data"></p>
    </div>

    <script>
        // 這裡貼上您的 CSV 網址
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSI52Sao1nYZJFPijvpRlUY-H6L0Hu5x1oWyfAZi0vIVmvLGZ7NIOfMoOWlAYQ-vcs7l56RrxjR2CU8/pub?gid=373464397&single=true&output=csv';

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                // 1. 印出所有欄位名稱 (Header)
                const fields = results.meta.fields;
                document.getElementById('fields').innerText = fields.join(', ');
                
                // 2. 印出第一筆資料是什麼樣子
                if (results.data.length > 0) {
                    document.getElementById('raw-data').innerText = JSON.stringify(results.data[0]);
                } else {
                    document.getElementById('raw-data').innerText = '資料是空的。';
                }
            },
            error: function(err) {
                document.body.innerText = '讀取失敗: ' + err;
            }
        });
    </script>
</body>
</html>
