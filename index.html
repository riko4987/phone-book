<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>自動讀取測試</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div id="status" style="color: red; font-weight: bold;">正在連線...</div>
    <div id="content"></div>

    <script>
        // 【請在此處貼上您的 CSV 發布網址】
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSI52Sao1nYZJFPijvpRlUY-H6L0Hu5x1oWyfAZi0vIVmvLGZ7NIOfMoOWlAYQ-vcs7l56RrxjR2CU8/pub?gid=373464397&single=true&output=csv';

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                if (results.errors.length > 0) {
                    document.getElementById('status').innerText = '解析錯誤: ' + JSON.stringify(results.errors);
                } else {
                    document.getElementById('status').innerText = '讀取成功！';
                    document.getElementById('content').innerText = JSON.stringify(results.data);
                }
            },
            error: function(err) {
                document.getElementById('status').innerText = '連線失敗: ' + err.message;
            }
        });
    </script>
</body>
</html>
